<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java & Spring Boot Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(270deg,#0f2027,#203a43,#2c5364);
    background-size: 600% 600%;
    animation: gradientMove 15s ease infinite;
    overflow:hidden;
    color:white;
}

@keyframes gradientMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    backdrop-filter: blur(10px);
}

.title{
    font-size:3rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:3px;
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from { text-shadow:0 0 10px #00f2ff; }
    to { text-shadow:0 0 20px #00f2ff, 0 0 40px #008cff; }
}

.skills{
    margin-top:50px;
    display:flex;
    gap:40px;
}

.card{
    width:250px;
    padding:30px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 0 15px rgba(0,255,255,0.4);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-15px) scale(1.05);
    box-shadow:0 0 30px #00f2ff;
}

.card h2{
    margin-bottom:15px;
}

.bar{
    height:10px;
    border-radius:10px;
    margin:10px 0;
    background:rgba(255,255,255,0.2);
    overflow:hidden;
}

.fill{
    height:100%;
    width:0;
    background:#00f2ff;
    transition:2s;
}

.card:hover .fill{
    width:100%;
}

.footer{
    position:absolute;
    bottom:20px;
    font-size:0.8rem;
    opacity:0.6;
}

</style>
</head>

<body>

<canvas id="rain"></canvas>

<div class="container">
    <div class="title">Java & Spring Boot</div>

    <div class="skills">
        <div class="card">
            <h2>Java</h2>
            <div class="bar"><div class="fill"></div></div>
            <p>POO • Streams • Collections • Threads</p>
        </div>

        <div class="card">
            <h2>Spring Boot</h2>
            <div class="bar"><div class="fill"></div></div>
            <p>REST API • JPA • Security • Microservices</p>
        </div>

        <div class="card">
            <h2>Backend Architecture</h2>
            <div class="bar"><div class="fill"></div></div>
            <p>Clean Code • SOLID • Docker • CI/CD</p>
        </div>
    </div>

    <div class="footer">
        Interactive Developer Experience
    </div>
</div>

<script>
const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let drops = [];
let mouse = {x:null, y:null};

window.addEventListener("mousemove", e=>{
    mouse.x = e.x;
    mouse.y = e.y;
});

class Drop{
    constructor(){
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.length = Math.random()*20+10;
        this.speed = Math.random()*4+4;
    }

    update(){
        this.y += this.speed;

        if(this.y > canvas.height){
            this.y = -20;
            this.x = Math.random()*canvas.width;
        }

        if(mouse.x){
            let dx = this.x - mouse.x;
            let dy = this.y - mouse.y;
            let distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < 100){
                this.x += dx/10;
                this.y += dy/10;
            }
        }
    }

    draw(){
        ctx.beginPath();
        ctx.strokeStyle = "rgba(0,242,255,0.8)";
        ctx.lineWidth = 1;
        ctx.moveTo(this.x,this.y);
        ctx.lineTo(this.x,this.y+this.length);
        ctx.stroke();
    }
}

function init(){
    drops = [];
    for(let i=0;i<400;i++){
        drops.push(new Drop());
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drops.forEach(drop=>{
        drop.update();
        drop.draw();
    });
    requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
